name: Publicar DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag da versão
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Compilar DMG
        run: ./scripts/build-dmg.sh
      - name: Publicar versão no GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
